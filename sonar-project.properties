# SonarCloud Configuration
sonar.organization=jamescodes84
sonar.projectKey=molt-speak
sonar.projectName=Molt Speak
sonar.projectVersion=1.0.0

# SonarCloud host
sonar.host.url=https://sonarcloud.io

# Source directories
