[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Async support (pytest-asyncio)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test categorization markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, full system)
    slow: Slow running tests
    asyncio: Async tests

# Coverage configuration
[coverage:run]
source = openclaw-ears/openclaw_ears
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
